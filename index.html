<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vols à Lille-Lesquin</title>
<meta name="theme-color" content="#0b5a8a">
<meta name="description" content="Départs et arrivées de l'aéroport de Lille-Lesquin, avec l'historique des vols réels.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vols Lesquin">
<style>
:root {
  --fond: #eef4f8; --carte: #ffffff; --texte: #14222e; --doux: #4a5b69;
  --bleu: #0b5a8a; --bleu-clair: #dcecf7; --ligne: #d5e0e8;
  --ok: #17643a; --ok-fond: #ddf3e5;
  --alerte: #8a4b00; --alerte-fond: #fff0d1;
  --mal: #a3122a; --mal-fond: #fde3e7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fond: #0e1a24; --carte: #172633; --texte: #eef3f7; --doux: #a9b8c4;
    --bleu: #6cbcf0; --bleu-clair: #1f3a4f; --ligne: #2b4152;
    --ok: #7fdca4; --ok-fond: #17402b;
    --alerte: #ffc766; --alerte-fond: #4a3510;
    --mal: #ff9aab; --mal-fond: #4d1a25;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte);
  font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: #0b5a8a; color: #fff; padding: 16px 16px 12px; }
header h1 { margin: 0; font-size: 1.5rem; }
header p { margin: 4px 0 0; font-size: 1rem; opacity: .95; }
main { max-width: 820px; margin: 0 auto; padding: 12px 12px 40px; }
.groupe { display: flex; gap: 8px; margin: 10px 0; }
.groupe button { flex: 1; min-height: 48px; font: inherit; font-weight: 700; cursor: pointer;
  border: 2px solid var(--bleu); background: var(--carte); color: var(--bleu); border-radius: 12px; }
.groupe button[aria-pressed="true"] { background: var(--bleu); color: var(--fond); }
.groupe.petit button { font-weight: 600; min-height: 44px; }
input[type=search] { width: 100%; min-height: 48px; font: inherit; padding: 8px 14px;
  border: 2px solid var(--ligne); border-radius: 12px; background: var(--carte); color: var(--texte); }
.info { color: var(--doux); font-size: 1rem; margin: 8px 2px; }
ul.vols { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.vol { background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px;
  padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; }
.vol.passe { opacity: .62; }
.heure { grid-row: span 2; font-size: 1.6rem; font-weight: 800; color: var(--bleu);
  font-variant-numeric: tabular-nums; min-width: 4.2ch; }
.ville { font-size: 1.15rem; font-weight: 700; text-transform: capitalize; }
.detail { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 1rem; color: var(--doux); }
.detail img { height: 26px; width: auto; max-width: 70px; background: #fff; border-radius: 4px; padding: 1px 3px; }
.etat { font-weight: 700; font-size: 1rem; padding: 2px 10px; border-radius: 999px;
  background: var(--bleu-clair); color: var(--bleu); }
.etat.ok { background: var(--ok-fond); color: var(--ok); }
.etat.alerte { background: var(--alerte-fond); color: var(--alerte); }
.etat.mal { background: var(--mal-fond); color: var(--mal); }
.vide, .erreur { background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 16px; margin-top: 10px; }
.erreur { border-color: var(--mal); }
.erreur button { min-height: 44px; font: inherit; margin-top: 8px; padding: 0 16px; border-radius: 10px;
  border: 2px solid var(--bleu); background: var(--carte); color: var(--bleu); font-weight: 700; cursor: pointer; }
.coche { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 8px; }
.coche input { width: 26px; height: 26px; }
h2.date { font-size: 1.1rem; margin: 14px 2px 0; color: var(--doux); }
.heure.inconnue { opacity: .55; }
.ecart { font-weight: 700; font-size: 1rem; padding: 2px 10px; border-radius: 999px; background: var(--ok-fond); color: var(--ok); }
.ecart.retard { background: var(--alerte-fond); color: var(--alerte); }
.ecart.non { background: var(--mal-fond); color: var(--mal); }
select { width: 100%; min-height: 48px; font: inherit; padding: 8px 14px; border: 2px solid var(--ligne);
  border-radius: 12px; background: var(--carte); color: var(--texte); }
[hidden] { display: none !important; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
.stat { background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 10px 14px; }
.stat b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--bleu); }
.stat.mal b { color: var(--mal); } .stat.ok b { color: var(--ok); } .stat.alerte b { color: var(--alerte); }
.stat span { font-size: 1rem; color: var(--doux); }
.ref { font-size: .95rem; color: var(--doux); word-break: break-all; }
.note { font-size: 1rem; color: var(--doux); margin: 8px 2px; }
footer { color: var(--doux); font-size: 1rem; margin-top: 24px; }
footer a { color: var(--bleu); }
</style>
</head>
<body>
<header>
  <h1>✈ Vols à Lille-Lesquin</h1>
  <p>Arrivées et départs, d'après les horaires publiés par l'aéroport</p>
</header>
<main>
  <div class="groupe" id="vue" role="group" aria-label="Affichage">
    <button data-v="direct" aria-pressed="true">En direct</button>
    <button data-v="histo" aria-pressed="false">Historique</button>
    <button data-v="compar" aria-pressed="false">Comparaison</button>
  </div>
  <div id="histo" hidden>
    <select id="histoJour" aria-label="Jour de l'historique"></select>
    <div class="groupe petit" id="histoSens" role="group" aria-label="Type de vol">
      <button data-v="DEP" aria-pressed="true">Départs</button>
      <button data-v="ARR" aria-pressed="false">Arrivées</button>
    </div>
    <div class="info" id="histoInfo"></div>
    <div id="histoContenu"></div>
  </div>
  <div id="compar" hidden>
    <select id="comparJour" aria-label="Jour de la comparaison"></select>
    <div class="groupe petit" id="comparSens" role="group" aria-label="Type de vol">
      <button data-v="DEP" aria-pressed="true">Départs</button>
      <button data-v="ARR" aria-pressed="false">Arrivées</button>
    </div>
    <div class="groupe petit" id="comparPeriode" role="group" aria-label="Période des statistiques">
      <button data-v="jour" aria-pressed="true">Ce jour</button>
      <button data-v="tous" aria-pressed="false">Tous les jours</button>
    </div>
    <label class="coche">Retard à partir de
      <select id="comparSeuil" aria-label="Seuil de retard">
        <option value="5">5 minutes</option><option value="15" selected>15 minutes</option><option value="30">30 minutes</option>
      </select>
    </label>
    <div id="comparStats"></div>
    <div class="info" id="comparInfo"></div>
    <div id="comparContenu"></div>
  </div>
  <div id="direct">
  <div class="groupe" id="sens" role="group" aria-label="Type de vol">
    <button data-v="departs" aria-pressed="true">Départs</button>
    <button data-v="arrivees" aria-pressed="false">Arrivées</button>
  </div>
  <div class="groupe petit" id="jour" role="group" aria-label="Jour">
    <button data-v="jour" aria-pressed="true">Aujourd'hui</button>
    <button data-v="demain" aria-pressed="false">Demain</button>
  </div>
  <input type="search" id="filtre" placeholder="Chercher une ville, une compagnie, un n° de vol" aria-label="Rechercher un vol">
  <label class="coche"><input type="checkbox" id="seulReel"> Seulement les vols avec heure réelle</label>
  <div class="info" id="maj" aria-live="polite">Chargement…</div>
  <div id="contenu"></div>
  </div>
  <footer>
    Source : <a href="https://www.lille.aeroport.fr/infos-vols-et-compagnies/arrivees-departs/">site officiel de l'aéroport de Lille</a>
    (vols du jour et du lendemain). Les horaires peuvent changer : vérifiez auprès de la compagnie.
    Mise à jour automatique toutes les minutes.
  </footer>
</main>
<script>
var URL_SOURCE = 'https://www.lille.aeroport.fr/infos-vols-et-compagnies/arrivees-departs/';
var IDS = { departs: { jour: 'depart-jour', demain: 'depart-demain' },
            arrivees: { jour: 'arrivees-jour', demain: 'arrivees-demain' } };
var HISTORIQUE_URL = 'https://script.google.com/macros/s/AKfycbw7h7-X0FRYKzii1GQJLdyMUfGy0b9kbcNXQg-ZfJekMMGUoXl1uF4PxJIYSeCAqEIQ/exec'; // adresse de l'application Web Apps Script (finit par /exec) ; vide = historique indisponible
var etat = { sens: 'departs', jour: 'jour', donnees: null, heure: null };

function h(tag, attrs, enfants) {
  var e = document.createElement(tag);
  for (var k in (attrs || {})) {
    if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
  }
  (enfants || []).forEach(function (c) { e.appendChild(c); });
  return e;
}

function lire(doc) {
  var res = {};
  Object.keys(IDS).forEach(function (sens) {
    res[sens] = {};
    Object.keys(IDS[sens]).forEach(function (jour) {
      var zone = doc.getElementById(IDS[sens][jour]);
      var vols = [];
      var tit = doc.getElementById('titre-date-' + (sens === 'departs' ? 'depart' : 'arrivees') + '-' + jour);
      var dm = tit && tit.textContent.match(/(\d{2})\/(\d{2})\/(\d{4})/);
      var date = dm ? dm[3] + '-' + dm[2] + '-' + dm[1] : '';
      if (zone) zone.querySelectorAll('tr').forEach(function (tr) {
        var td = tr.querySelectorAll('td');
        if (td.length < 5 || !/^\d{1,2}:\d{2}$/.test(td[0].textContent.trim())) return;
        var img = td[2].querySelector('img');
        var statut = td[4].textContent.replace(/[\s ]+/g, ' ').trim();
        var m = statut.match(/(\d{1,2})\s*[:h]\s*(\d{2})/);
        // heure réelle = heure donnée dans un état « constaté » (Décollé, Atterri…), pas dans « Prévu à »
        var reel = m && !/pr[ée]vu|estim/i.test(statut) ? ('0' + m[1]).slice(-2) + ':' + m[2] : '';
        vols.push({
          heure: td[0].textContent.trim().padStart(5, '0'),
          numero: td[1].textContent.trim(),
          compagnie: img ? (img.getAttribute('title') || img.getAttribute('alt') || '') : td[2].textContent.trim(),
          logo: img ? img.getAttribute('src') : '',
          ville: td[3].textContent.trim().toLowerCase(),
          statut: statut,
          reel: reel,
          date: date
        });
      });
      res[sens][jour] = vols;
    });
  });
  return res;
}

function charger() {
  document.getElementById('maj').textContent = 'Mise à jour…';
  return fetch(URL_SOURCE, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (txt) {
      var doc = new DOMParser().parseFromString(txt, 'text/html');
      var d = lire(doc);
      var total = 0;
      Object.keys(d).forEach(function (s) { total += d[s].jour.length + d[s].demain.length; });
      if (!total) throw new Error('aucune donnée');
      etat.donnees = d; etat.heure = new Date(); etat.erreur = false;
      if (!etat.choisi && !d[etat.sens].jour.length && d[etat.sens].demain.length) {
        etat.jour = 'demain';
        document.querySelectorAll('#jour button').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.v === 'demain'); });
      }
      afficher();
    })
    .catch(function () {
      etat.erreur = true; afficher();
    });
}

function classeStatut(s) {
  var t = s.toLowerCase();
  if (/annul|supprim/.test(t)) return 'mal';
  if (/retard|d[ée]rout|report/.test(t)) return 'alerte';
  if (/atterri|d[ée]coll|arriv[ée]|embarqu|ferm/.test(t)) return 'ok';
  return '';
}

function afficher() {
  var c = document.getElementById('contenu'), maj = document.getElementById('maj');
  c.textContent = '';
  if (!etat.donnees) {
    maj.textContent = '';
    var b = h('button', { text: 'Réessayer', type: 'button' }); b.onclick = charger;
    c.appendChild(h('div', { class: 'erreur' }, [
      h('strong', { text: 'Impossible de lire les horaires pour le moment.' }),
      h('div', { text: 'Vérifiez votre connexion, ou consultez directement le site de l\'aéroport.' }), b]));
    return;
  }
  maj.textContent = (etat.erreur ? 'Connexion perdue, affichage des dernières données. ' : '') +
    'Dernière mise à jour à ' + etat.heure.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '.';
  var q = document.getElementById('filtre').value.trim().toLowerCase();
  var liste = etat.donnees[etat.sens][etat.jour];
  var seul = document.getElementById('seulReel').checked;
  var vols = liste.filter(function (v) {
    if (seul && !v.reel) return false;
    return !q || (v.ville + ' ' + v.compagnie + ' ' + v.numero).toLowerCase().indexOf(q) >= 0;
  });
  if (!vols.length) {
    c.appendChild(h('div', { class: 'vide', text: seul && !liste.some(function (v) { return v.reel; }) ? 'Aucune heure réelle publiée pour le moment : les vols ne sont pas encore partis ou arrivés.' : q ? 'Aucun vol ne correspond à votre recherche.' : 'Aucun vol à afficher pour ce jour.' }));
    return;
  }
  var d = vols[0].date && vols[0].date.split('-').reverse().join('/');
  if (d) c.appendChild(h('h2', { class: 'date', text: (etat.sens === 'departs' ? 'Départs' : 'Arrivées') + ' du ' + d }));
  var ul = h('ul', { class: 'vols' });
  vols.forEach(function (v) {
    var passe = !!v.reel;
    var det = [];
    if (v.logo) det.push(h('img', { src: v.logo, alt: '', loading: 'lazy' }));
    det.push(h('span', { text: v.compagnie + ' · vol ' + v.numero }));
    det.push(h('span', { text: v.reel ? 'Heure réelle (prévu : ' + v.heure + ')' : 'Heure réelle pas encore connue (prévu : ' + v.heure + ')' }));
    if (v.statut) det.push(h('span', { class: 'etat ' + classeStatut(v.statut), text: v.statut }));
    ul.appendChild(h('li', { class: 'vol' + (passe ? ' passe' : '') }, [
      h('div', { class: 'heure' + (v.reel ? '' : ' inconnue'), text: v.reel || v.heure }),
      h('div', { class: 'ville', text: (etat.sens === 'departs' ? 'Vers ' : 'De ') + v.ville }),
      h('div', { class: 'detail' }, det)
    ]));
  });
  c.appendChild(ul);
}

function groupe(id, cle) {
  document.getElementById(id).addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    etat[cle] = b.dataset.v; etat.choisi = true;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    afficher();
  });
}
groupe('sens', 'sens'); groupe('jour', 'jour');

var AEROPORTS = {"LFQQ":"Lille-Lesquin","LFMN":"Nice","DAAG":"Alger","LFBO":"Toulouse-Blagnac","LFML":"Marseille-Provence","GMMX":"Marrakech","LFBD":"Bordeaux-Mérignac","LFKJ":"Ajaccio","LFKF":"Figari","DTTJ":"Djerba-Zarzis","GMMN":"Casablanca","LGIR":"Héraklion","DAOO":"Oran","LFKB":"Bastia","LEPA":"Palma de Majorque","LFRN":"Rennes","LEMG":"Malaga","LSGG":"Genève","LEBL":"Barcelone","LPPR":"Porto","LPFR":"Faro","GMFF":"Fès","LFMP":"Perpignan","DABC":"Constantine","LFCR":"Rodez","LGKR":"Corfou","GMAD":"Agadir","LICJ":"Palerme","LEAL":"Alicante","LGAV":"Athènes","DTTA":"Tunis-Carthage","LGRP":"Rhodes","LFTH":"Toulon-Hyères","LIBD":"Bari","LFQT":"Merville-Calonne","LFMT":"Montpellier","LEMD":"Madrid","LEZL":"Séville","LFPB":"Paris-Le Bourget","LFKC":"Calvi","DTMB":"Monastir","LEVC":"Valence","LFAV":"Valenciennes","LIEO":"Olbia","GMFO":"Oujda","EBCI":"Charleroi","LEMI":"Murcie","DAON":"Tlemcen","LFBZ":"Biarritz","LGKO":"Kos","LYPG":"Podgorica","LDSP":"Split","GCLP":"Grande Canarie","LBWN":"Varna","LDDU":"Dubrovnik","LFAC":"Calais-Dunkerque","LEMH":"Minorque","LFAT":"Le Touquet","LFST":"Strasbourg","EGSS":"Londres-Stansted","LFRS":"Nantes","LBBG":"Bourgas","EBKT":"Courtrai","LFOT":"Tours","LFLY":"Lyon-Bron","LKPR":"Prague","DAAS":"Sétif","EGNR":"Hawarden","LFRZ":"Saint-Nazaire","LFRH":"Lorient","EBAW":"Anvers","EGPH":"Édimbourg","LFRG":"Deauville","LATI":"Tirana","LFPN":"Toussus-le-Noble","LFAQ":"Albert-Bray","LFDB":"Montauban","LFLS":"Grenoble","LFRK":"Caen","ZZZZ":"Terrain non renseigné","EHGG":"Groningue","EDDH":"Hambourg","LEZG":"Saragosse","LFPG":"Paris-Charles de Gaulle","EKCH":"Copenhague","EHTE":"Teuge","DAAE":"Béjaïa","LFOP":"Rouen","LFMH":"Saint-Étienne","LFXU":"Les Mureaux","LFBS":"Biscarrosse","LFLW":"Aurillac","EGHH":"Bournemouth","LFLO":"Roanne","LFLC":"Clermont-Ferrand","EGLK":"Blackbushe","LFPV":"Vélizy-Villacoublay","EGJA":"Aurigny","EGJJ":"Jersey","LFGA":"Colmar","LFQA":"Reims","EGNM":"Leeds Bradford","LFMQ":"Le Castellet","EKRK":"Roskilde","LFMD":"Cannes-Mandelieu","EGBB":"Birmingham","LFQB":"Troyes","EDDR":"Sarrebruck","EDDL":"Düsseldorf","LFRT":"Saint-Brieuc","LFFI":"Ambérieu","EDDK":"Cologne","KMSP":"Minneapolis","LFMV":"Avignon","LFBK":"Montluçon","LOWI":"Innsbruck","EDDE":"Erfurt","LIRZ":"Pérouse","LFAK":"Dunkerque","LFTZ":"La Môle (Saint-Tropez)","EDDG":"Münster-Osnabrück","LFBN":"Niort","EDMO":"Oberpfaffenhofen","BIKF":"Keflavik","LKTB":"Brno","LMML":"Malte","LFEA":"Belle-Île","LIRQ":"Florence","ESSB":"Stockholm-Bromma","LFRM":"Le Mans","LFJR":"Angers","LFBH":"La Rochelle","EGWU":"Northolt","LFRD":"Dinard","LFLA":"Auxerre","ELLX":"Luxembourg","LFSD":"Dijon","LEVX":"Vigo","EHMZ":"Middelburg","LFRB":"Brest","LSMP":"Payerne","LFQE":"Étain-Rouvres","LFLM":"Mâcon","LSZR":"Altenrhein","LFAG":"Péronne","LFQO":"Lille-Marcq","LIPX":"Vérone","LFOK":"Châlons-Vatry","LFJL":"Metz-Nancy","LEPP":"Pampelune","LFSL":"Brive","LFRC":"Cherbourg","LFPT":"Pontoise","EGNJ":"Humberside","EGCC":"Manchester","EBLG":"Liège","LFOA":"Avord","LFBM":"Mont-de-Marsan","EBOS":"Ostende","LFSB":"Bâle-Mulhouse","LFPO":"Paris-Orly","EGLL":"Londres-Heathrow","EGKK":"Londres-Gatwick","EHAM":"Amsterdam","EBBR":"Bruxelles"};
var COMPAGNIES = {"VOE":"Volotea","VOO":"Volotea","EJU":"easyJet Europe","EZY":"easyJet","EZS":"easyJet Switzerland","FPO":"Europe Airpost","RYR":"Ryanair","DAH":"Air Algérie","JAF":"TUI fly Belgium","LBT":"Nouvelair","TVF":"Transavia France","TVS":"Smartwings","RAM":"Royal Air Maroc","MNE":"Air Montenegro","SEH":"Sky Express","ENT":"Enter Air","NJE":"NetJets Europe","KLM":"KLM","TYW":"Tyrolean Jet Services"};
function nomAeroport(c) { return !c ? '—' : (AEROPORTS[c] ? AEROPORTS[c] + ' (' + c + ')' : c); }
function nomCompagnie(v) { // le début de l'indicatif dit souvent mieux qui vole que le code de l'exploitant
  var p = (v.indicatif || '').slice(0, 3);
  return COMPAGNIES[p] || COMPAGNIES[v.compagnie] || v.compagnie || 'Compagnie non renseignée';
}

var vue = { jours: null, reel: {}, compar: {}, stats: null, sensH: 'DEP', sensC: 'DEP', periode: 'jour' };
function appel(param) {
  return fetch(HISTORIQUE_URL + '?' + param).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}
function message(id, txt) {
  document.getElementById(id + 'Contenu').textContent = '';
  document.getElementById(id + 'Contenu').appendChild(h('div', { class: 'vide', text: txt }));
}
var ATTENTE = 'Chargement, cela peut prendre quelques secondes…';

function chargerJours(id) { // liste des jours, partagée par « Historique » et « Comparaison »
  var sel = document.getElementById(id + 'Jour');
  if (sel.options.length) return Promise.resolve();
  return (vue.jours ? Promise.resolve(vue.jours) : appel('').then(function (d) { vue.jours = d.jours; return d.jours; })).then(function (jours) {
    jours.forEach(function (j) { sel.appendChild(h('option', { value: j, text: j.split('-').reverse().join('/') })); });
    var auj = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }); // on ouvre aujourd'hui, pas demain
    sel.value = jours.filter(function (j) { return j <= auj; })[0] || jours[0];
  });
}

function ouvrir(id, suite) {
  if (!HISTORIQUE_URL) return message(id, "L'historique n'est pas encore branché.");
  message(id, ATTENTE);
  chargerJours(id).then(function () {
    if (!vue.jours.length) return message(id, "Pas encore de données : l'historique se remplit chaque jour.");
    suite();
  }).catch(function () { message(id, "Impossible de lire l'historique pour le moment."); });
}

/* --- Historique : vols réels, toutes les colonnes de la feuille --- */
function histoChoisir() {
  var j = document.getElementById('histoJour').value;
  message('histo', ATTENTE);
  (vue.reel[j] ? Promise.resolve(vue.reel[j]) : appel('vue=reel&date=' + encodeURIComponent(j)).then(function (d) { return vue.reel[j] = d.vols; }))
    .then(histoAfficher).catch(function () { message('histo', 'Impossible de lire ce jour.'); });
}
function histoAfficher() {
  var j = document.getElementById('histoJour').value;
  var tous = vue.reel[j] || [];
  var vols = tous.filter(function (v) { return v.sens === vue.sensH; });
  document.getElementById('histoInfo').textContent = vols.length + (vue.sensH === 'DEP' ? ' départs' : ' arrivées') + ' observés par le radar (' + tous.length + ' vols dans la journée).';
  var c = document.getElementById('histoContenu');
  c.textContent = '';
  if (!vols.length) return message('histo', 'Aucun vol pour ce jour.');
  var ul = h('ul', { class: 'vols' });
  vols.forEach(function (v) {
    var det = [
      h('span', { text: nomCompagnie(v) + (v.compagnie ? ' · code ' + v.compagnie + (v.compagnie_iata ? '/' + v.compagnie_iata : '') : '') }),
      h('span', { text: 'Indicatif ' + (v.indicatif || '—') }),
      h('span', { text: 'Avion ' + (v.avion || '—') })
    ];
    ul.appendChild(h('li', { class: 'vol' }, [
      h('div', { class: 'heure', text: v.heure }),
      h('div', { class: 'ville', text: nomAeroport(v.de) + ' → ' + nomAeroport(v.vers) }),
      h('div', { class: 'detail' }, det.concat([h('span', { class: 'ref', text: 'Réf. ' + v.id })]))
    ]));
  });
  c.appendChild(ul);
}

/* --- Comparaison : prévu / réel et statistiques --- */
function comparChoisir() {
  var j = document.getElementById('comparJour').value;
  message('compar', ATTENTE);
  Promise.all([
    vue.compar[j] ? Promise.resolve(vue.compar[j]) : appel('date=' + encodeURIComponent(j)).then(function (d) { return vue.compar[j] = d.vols; }),
    vue.stats ? Promise.resolve(vue.stats) : appel('vue=stats').then(function (d) { return vue.stats = d.jours; })
  ]).then(comparAfficher).catch(function () { message('compar', 'Impossible de lire la comparaison.'); });
}
function mediane(a) {
  var s = a.slice().sort(function (x, y) { return x - y; }), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function signe(n) { return (n > 0 ? '+' : '') + n; }
function carte(valeur, libelle, classe) {
  return h('div', { class: 'stat' + (classe ? ' ' + classe : '') }, [h('b', { text: valeur }), h('span', { text: libelle })]);
}
function comparStats() {
  var j = document.getElementById('comparJour').value, seuil = +document.getElementById('comparSeuil').value;
  var jours = vue.stats.filter(function (d) { return vue.periode === 'tous' || d.date === j; });
  var b = { prevus: 0, observes: 0, nonObserves: 0, nonPrevus: 0, ecarts: [] };
  jours.forEach(function (d) {
    var x = d[vue.sensC];
    b.prevus += x.prevus; b.observes += x.observes; b.nonObserves += x.nonObserves; b.nonPrevus += x.nonPrevus;
    b.ecarts = b.ecarts.concat(x.ecarts);
  });
  var z = document.getElementById('comparStats');
  z.textContent = '';
  if (!b.prevus && !b.nonPrevus) return z.appendChild(h('div', { class: 'vide', text: "Pas d'horaires prévus enregistrés pour ce jour : la comparaison commence le 26/09/2026." }));
  var retards = b.ecarts.filter(function (e) { return e >= seuil; }).length;
  var avance = b.ecarts.filter(function (e) { return e <= -seuil; }).length;
  var pc = function (n, d) { return d ? Math.round(1000 * n / d) / 10 + ' %' : '—'; };
  var moy = b.ecarts.length ? Math.round(b.ecarts.reduce(function (s, e) { return s + e; }, 0) / b.ecarts.length * 10) / 10 : null;
  z.appendChild(h('div', { class: 'stats' }, [
    carte(b.prevus, 'vols prévus'),
    carte(b.observes, 'vus par le radar (' + pc(b.observes, b.prevus) + ')'),
    carte(retards, 'en retard de ' + seuil + ' min ou plus', retards ? 'alerte' : 'ok'),
    carte(pc(retards, b.observes), 'de retards parmi les vols vus', retards ? 'alerte' : 'ok'),
    carte(avance, 'en avance de ' + seuil + ' min ou plus'),
    carte(moy === null ? '—' : signe(moy) + ' min', 'écart moyen'),
    carte(b.ecarts.length ? signe(mediane(b.ecarts)) + ' min' : '—', 'écart médian'),
    carte(b.ecarts.length ? signe(Math.max.apply(null, b.ecarts)) + ' min' : '—', 'plus gros retard'),
    carte(b.nonObserves, 'prévus mais pas vus', b.nonObserves ? 'mal' : ''),
    carte(b.nonPrevus, 'vus mais pas prévus')
  ]));
  z.appendChild(h('div', { class: 'note', text: "Écart = heure réelle vue par le radar moins heure prévue. Un vol « pas vu » peut être annulé, ou simplement absent des données. Pour un départ, le radar voit le décollage, quelques minutes après l'heure prévue de départ : les départs paraissent donc un peu en retard." }));
}
function comparAfficher() {
  comparStats();
  var j = document.getElementById('comparJour').value;
  var vols = (vue.compar[j] || []).filter(function (v) { return v.sens === vue.sensC; });
  var c = document.getElementById('comparContenu');
  c.textContent = '';
  document.getElementById('comparInfo').textContent = '';
  if (!vols.some(function (v) { return v.prevu; })) return;
  var ul = h('ul', { class: 'vols' });
  vols.forEach(function (v) {
    var det = [h('span', { text: v.compagnie + (v.numero ? ' · vol ' + v.numero : '') + (v.avion ? ' · ' + v.avion : '') })];
    if (v.resultat === 'observe') {
      det.push(h('span', { class: 'ecart' + (v.ecart >= +document.getElementById('comparSeuil').value ? ' retard' : ''),
        text: v.ecart === 0 ? "À l'heure" : signe(v.ecart) + ' min' }));
    } else if (v.resultat === 'non_observe') {
      det.push(h('span', { class: 'ecart non', text: 'Pas vu par le radar' }));
    } else {
      det.push(h('span', { class: 'ecart retard', text: 'Vol non prévu' }));
    }
    if (v.prevu) det.push(h('span', { text: 'Prévu à ' + v.prevu }));
    ul.appendChild(h('li', { class: 'vol' }, [
      h('div', { class: 'heure' + (v.reel ? '' : ' inconnue'), text: v.reel || v.prevu }),
      h('div', { class: 'ville', text: (v.sens === 'DEP' ? 'Vers ' : 'De ') + (AEROPORTS[v.ville] || v.ville || '—').toLowerCase() }),
      h('div', { class: 'detail' }, det)
    ]));
  });
  c.appendChild(ul);
}

function bascule(id, cle, action) {
  document.getElementById(id).addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    vue[cle] = b.dataset.v;
    action();
  });
}
bascule('histoSens', 'sensH', function () { if (vue.reel[document.getElementById('histoJour').value]) histoAfficher(); });
bascule('comparSens', 'sensC', function () { if (vue.stats) comparAfficher(); });
bascule('comparPeriode', 'periode', function () { if (vue.stats) comparAfficher(); });
document.getElementById('vue').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
  ['direct', 'histo', 'compar'].forEach(function (id) { document.getElementById(id).hidden = id !== b.dataset.v; });
  if (b.dataset.v === 'histo') ouvrir('histo', histoChoisir);
  if (b.dataset.v === 'compar') ouvrir('compar', comparChoisir);
});
document.getElementById('histoJour').addEventListener('change', histoChoisir);
document.getElementById('comparJour').addEventListener('change', comparChoisir);
document.getElementById('comparSeuil').addEventListener('change', function () { if (vue.stats) comparAfficher(); });
document.getElementById('filtre').addEventListener('input', afficher);
document.getElementById('seulReel').addEventListener('change', afficher);
charger();
setInterval(charger, 60000);
</script>
